name: sigflod
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43 followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions consider running `flutter pub upgrade --major-versions`. Alternatively, dependencies can be manually updated by changing the version numbers below to the latest version available on pub.dev. To see which dependencies have newer versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter  # The Flutter SDK is required for building Flutter applications. It provides the core framework and tools needed to develop and run Flutter apps.

  # --- FIREBASE ---
  firebase_core: ^4.7.0     # Core Firebase SDK for Flutter, required for initializing Firebase in the app.
  firebase_auth: ^6.4.0     # Firebase Authentication SDK for Flutter, used for handling user authentication (sign-up, sign-in, etc.) in the app.
  cloud_firestore: ^6.3.0   # Cloud Firestore SDK for Flutter, used for interacting with the Firestore database (CRUD operations, real-time updates, etc.) in the app.
  firebase_storage: ^13.4.1 # Firebase Storage SDK for Flutter, used for uploading and downloading files (e.g., patient profile pictures) to/from Firebase Storage.

  # --- PDF GENERATION ---
  pdf: ^3.11.1      # A powerful library for creating PDF documents in Flutter, used for generating the attendance reports in PDF format.
  printing: ^5.13.4 # A Flutter plugin that provides printing and PDF preview capabilities, used for allowing users to preview and print the generated PDF reports directly from the app.

  # --- STATE MANAGEMENT ---
  flutter_bloc: ^9.1.1  # State management engine: BLoC/Cubit.
  equatable: ^2.0.5     # Essential for error-free state comparisons in BLoC/Cubit.
  bloc: ^9.0.0          # Core BLoC library, required for using BLoC/Cubit in the app.

  # --- CLEAN ARCHITECTURE ---
  get_it: ^9.2.1  # Service Locator (Dependency injection)
  dartz: ^0.10.1  # Functional programming (for handling errors elegantly)

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8 # Provides a set of iOS-style icons that can be used in Flutter applications, useful for creating a consistent look and feel on iOS devices.

  # --- COUNTRY FLAGS ---
  country_flags: ^4.1.2 # Provides a collection of country flag icons that can be easily used in Flutter applications, useful for displaying

  # --- IMAGE HANDLING ---
  image_picker: ^1.1.2  # Plugin that allows the user to select an image from the device gallery or take a photo with the camera, used for capturing patient profile pictures.
  file_picker: ^11.0.2   # Plugin that allows the user to pick files from the device's file system, used for selecting images or other files to be uploaded to Firebase Storage.
  image: ^4.5.2         # Pure Dart library for image processing, used for resizing and compressing pictures before uploading them to Firebase Storage.

  # --- MEDIA PLAYBACK ---
  media_kit: ^1.1.11            # Cross-platform media engine that unifies audio and video playback across Android, iOS, macOS, Windows, Linux and web with a single API.
  media_kit_video: ^2.0.1       # Official Flutter widget that renders the media_kit video output natively on every supported platform.
  media_kit_libs_video: ^1.0.5  # Bundles libmpv and codecs inside the application binary so end users do not need to install any system-level multimedia libraries.

  # --- LOCALIZATION ---
  flutter_localizations:
    sdk: flutter  # Provides localizations for Flutter's own widgets (e.g., Material and Cupertino widgets), necessary for supporting multiple languages in the app.
  intl: any

dev_dependencies:
  # The "flutter_test" package below is used for writing unit and widget tests for Flutter applications. It provides a testing framework and utilities for testing Flutter widgets and functionality.
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to encourage good coding practices. The lint set provided by the package is activated in the `analysis_options.yaml` file located at the root of your package. See that file for information about deactivating specific lint rules and activating additional ones.
  flutter_lints: ^6.0.0

  # The "flutter_launcher_icons" package below is used for generating app icons for both Android and iOS platforms from a single source image. It simplifies the process of creating and managing app icons, ensuring that they are correctly sized and formatted for each platform.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is included with your application, so that you can use the icons in the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/fonts/Crimson_Text/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here, in this "flutter" section. Each entry in this list should have a "family" key with the font family name, and a "fonts" key with a list giving the asset and other descriptors for the font. For example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies, see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/images/sigflod_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/sigflod_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/sigflod_logo.png"
    icon_size: 256